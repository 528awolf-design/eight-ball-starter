<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic 8 Ball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <h1>MAGIC 8 BALL</h1>
    </header>

    <main class="game-board">
      <div class="question-grid">
        <div class="input-column left-column">
          <div class="panel input-panel">
            <label class="field-label" for="nameInput">Name:</label>
            <input id="nameInput" class="text-field" type="text" aria-label="Name">

            <label class="field-label" for="questionInput">Question:</label>
            <textarea id="questionInput" class="text-field question-field" aria-label="Question"></textarea>
          </div>
        </div>

        <div class="orb-column">
          <p id="greeting" class="greeting">Hello!</p>
          <p id="questionOut" class="question-out">You asked: Nothing Yet!</p>
          <button type="button" id="askButton" onclick="askEightBall()">Ask Away!</button>
          <div class="orb" aria-hidden="true">
            <svg class="face" viewBox="0 0 300 300" aria-hidden="true">
              <ellipse cx="92" cy="94" rx="18" ry="36"></ellipse>
              <ellipse cx="208" cy="94" rx="18" ry="36"></ellipse>
              <path d="M75 177 Q150 298 225 177"></path>
            </svg>
          </div>
        </div>

        <div class="input-column right-column">
          <div class="panel result-panel">
            <p class="field-label">Answer:</p>
            <div id="answer" class="display-box" aria-label="Answer" aria-live="polite"></div>

            <p class="field-label">Type:</p>
            <div id="answerType" class="display-box type-box" aria-label="Answer type" aria-live="polite"></div>
          </div>
        </div>
      </div>

      <section class="how-it-works" aria-label="How it works">
        <h2>How it Works:</h2>
        <div class="step-row">
          <span class="step-number">1</span>
          <div class="step-box text-center">Enter your name in the Name box.</div>
        </div>
        <div class="step-row">
          <span class="step-number">2</span>
          <div class="step-box text-center">Type a yes-or-no question in the Question box.</div>
        </div>
        <div class="step-row">
          <span class="step-number">3</span>
          <div class="step-box text-center">Read the answer and type shown beside the Magic 8 Ball.</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">Aaron Wolf, 2026</footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
